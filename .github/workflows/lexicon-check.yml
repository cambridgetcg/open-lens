name: lexicon
on: [push, pull_request]
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero-dependency build validates the lexicon and regenerates both npm and
      # browser artifacts. The diff check catches stale or hand-edited output.
      - run: npm run build
      - run: npm test
      - run: npx --yes wrangler@4.110.0 pages functions build functions --outdir /tmp/open-lens-functions
      - run: git diff --exit-code -- public packages/lexicon-en
